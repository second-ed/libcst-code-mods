---
    name: Deploy docs

    on:
      push:
        branches: [main]
      workflow_dispatch:

    permissions:
      contents: read
      id-token: write

    jobs:
      publish_sphinx_docs:
        runs-on: ubuntu-latest
        permissions:
          contents: write
        steps:
          - uses: actions/checkout@v6

          - name: Install uv
            uses: astral-sh/setup-uv@v7
            with:
              enable-cache: true
              cache-dependency-glob: "uv.lock"

          - name: Install the project
            run: uv sync --dev

          - name: Sphinx build
            run: |
              uv run sphinx-apidoc -o docs/source src/libcst_code_mods/ --separate
              uv run sphinx-build docs/source docs/docs-build/html
          - name: Deploy
            uses: peaceiris/actions-gh-pages@v3
            with:
              publish_branch: gh-pages
              github_token: ${{ secrets.GITHUB_TOKEN }}
              publish_dir: docs/docs-build/html
              force_orphan: true
